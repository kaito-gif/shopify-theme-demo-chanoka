name: CI
on: [push]
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    # theme-check-action は結果を Check Run として書き込む。新規リポジトリの
    # GITHUB_TOKEN は既定が読み取りのみで、付けないと最後で権限エラーになる。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
